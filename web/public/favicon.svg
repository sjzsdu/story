<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 朱红印面，圆角仿印章石 -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="#A02C2C" />
  <!-- 印石边磨损质感：内圈深色描边 -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="3" fill="none" stroke="#7A1E1E" stroke-width="1" opacity="0.6" />
  <!-- "史" 字，serif 字体保留古韵 -->
  <text x="16" y="23" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',serif" font-size="20" font-weight="bold" fill="#F5E6D3">史</text>
</svg>
